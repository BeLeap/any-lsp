name: CI

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare HeadVer release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update version, commit, and tag
        id: release
        env:
          HEADVER_HEAD: '0'
        run: |
          set -euo pipefail

          git fetch origin master --tags --force
          source_sha="$GITHUB_SHA"

          # Reuse a release commit if this workflow is retried after the
          # version commit or tag was already pushed.
          release_commit="$(git log origin/master --format='%H' --grep="for ${source_sha}" -n 1 || true)"
          if [[ -n "$release_commit" ]]; then
            version="$(git show "$release_commit:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
            tag="v${version}"
            if git tag --list "$tag" | grep -Fxq "$tag"; then
              test "$(git rev-list -n 1 "$tag")" = "$release_commit"
            else
              git tag --annotate "$tag" "$release_commit" --message "Release $tag"
              git push origin "$tag"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$(git rev-parse origin/master)" != "$source_sha" ]]; then
            echo "master moved after this workflow started; refusing to release a stale commit" >&2
            exit 1
          fi

          # HeadVer: {head}.{yearweek}.{build}
          # https://github.com/line/headver
          yearweek="$(date -u +%g%V)"
          next_build=0

          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" =~ ^v${HEADVER_HEAD}\.[0-9]{4}\.([0-9]+)$ ]]; then
              existing_build="${BASH_REMATCH[1]}"
              if (( existing_build >= next_build )); then
                next_build=$((existing_build + 1))
              fi
            fi
          done < <(git tag --list "v${HEADVER_HEAD}.*")

          tag="v${HEADVER_HEAD}.${yearweek}.${next_build}"
          version="${tag#v}"

          nix develop --command cargo set-version "$version"
          nix develop --command cargo update --workspace --offline

          actual_version="$(nix develop --command cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$actual_version" = "$version"
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: ${tag} for ${source_sha} [skip ci]"
          release_commit="$(git rev-parse HEAD)"
          git push origin HEAD:master

          git tag --annotate "$tag" "$release_commit" --message "Release $tag"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.system }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify Cargo version
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" = "${{ needs.prepare.outputs.version }}"

      - name: Build binary
        run: nix build ".#packages.${{ matrix.system }}.any-lsp" --print-build-logs

      - name: Package binary
        run: |
          mkdir -p dist
          cp -L result/bin/any-lsp "dist/any-lsp-${{ matrix.system }}"
          tar -C dist -czf "any-lsp-${{ matrix.system }}.tar.gz" "any-lsp-${{ matrix.system }}"

      - name: Upload platform CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.system }}
          path: any-lsp-${{ matrix.system }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*
          path: dist
          merge-multiple: true

      - name: Create or update release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
